name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/netscout${ext}" ./cmd/netscout
          "./dist/netscout${ext}" version
      - uses: actions/upload-artifact@v4
        with:
          name: netscout-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
